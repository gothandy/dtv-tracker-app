# Pull request checks + deploy to the pre-production "preview" slot.
#
# The preview slot is a clone of production: same settings, live SharePoint
# data, real emails. Treat it as production. One slot is shared by all PRs;
# the most recent push wins.
#
# Azure setup (one-off): the deploy job runs in the GitHub environment
# "preview", so the deploy app registration needs a federated credential for
# "GitHub Actions → Environment: preview" on this repo, and the DTVTrackerApp
# app needs a "preview" deployment slot. See docs/azure-app-service.md.

name: PR checks and preview deploy

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: preview-slot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js version
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install, build and test backend
        run: |
          npm install
          npm run build
          npx vitest run

      - name: Build and test frontend
        run: |
          cd frontend
          npm install
          npm run build
          npx vitest run

      - name: Prune dev dependencies
        run: npm prune --production

      - name: Create deployment zip
        run: zip -r release.zip app.js package.json dist/ node_modules/ frontend/dist/ templates/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v6
        with:
          name: node-app
          path: release.zip

  deploy-preview:
    runs-on: ubuntu-latest
    needs: build
    # Secrets aren't available to PRs from forks; only deploy PRs from this repo.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: preview
      url: ${{ steps.slot.outputs.url }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BFA8880C27E84E65B0C3011181A0AC76 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_94C7F51E6E60439880C12B615207E225 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_659B92CC0E6B4EC59EC9372AB5981C14 }}

      - name: Find resource group and slot URL
        id: slot
        run: |
          RG=$(az webapp list --query "[?name=='DTVTrackerApp'].resourceGroup" -o tsv)
          HOST=$(az webapp show --resource-group "$RG" --name DTVTrackerApp --slot preview --query defaultHostName -o tsv)
          echo "resource_group=$RG" >> $GITHUB_OUTPUT
          echo "url=https://$HOST" >> $GITHUB_OUTPUT

      - name: Deploy to preview slot
        run: |
          az webapp deploy \
            --resource-group ${{ steps.slot.outputs.resource_group }} \
            --name DTVTrackerApp \
            --slot preview \
            --src-path release.zip \
            --type zip \
            --clean true \
            --async

      - name: Configure slot settings
        run: |
          az webapp config set \
            --resource-group ${{ steps.slot.outputs.resource_group }} \
            --name DTVTrackerApp \
            --slot preview \
            --linux-fx-version "NODE|24-lts"
          az webapp config appsettings set \
            --resource-group ${{ steps.slot.outputs.resource_group }} \
            --name DTVTrackerApp \
            --slot preview \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false
          az webapp config appsettings delete \
            --resource-group ${{ steps.slot.outputs.resource_group }} \
            --name DTVTrackerApp \
            --slot preview \
            --setting-names WEBSITE_RUN_FROM_PACKAGE SITE_MODE 2>/dev/null || true

      - name: Wait for preview to be healthy
        run: |
          URL="${{ steps.slot.outputs.url }}/api/health"
          echo "Waiting for $URL ..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL") || STATUS="000"
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Preview is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Preview did not become healthy within 5 minutes."
          exit 1

      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.slot.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "🚀 Deployed \`${SHA:0:7}\` to the **preview** slot: $URL

          ⚠️ Pre-production: live SharePoint data and real emails. Another PR deploying will replace this."
